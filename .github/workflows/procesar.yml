name: Procesar BMSN

on:
  issues:
    types: [opened]

# Un issue a la vez para que los commits no choquen.
concurrency:
  group: bmsn-datos
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  procesar:
    if: startsWith(github.event.issue.title, 'BMSN')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: proc
        run: node scripts/procesar.mjs

      - name: Guardar cambios
        if: steps.proc.outputs.cambio == 'si'
        env:
          NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "bmsn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "BMSN: datos del issue #$NUM"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

      - name: Responder y cerrar issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          [ -f respuesta.md ] || echo "⚠️ Error al procesar. Revisa el log de la Action." > respuesta.md
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file respuesta.md
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
