name: Mantener Supabase activo

# Respaldo de la "visita" diaria que ya hace Supabase (pg_cron): en el plan gratis
# un proyecto sin actividad durante 7 días se pausa. Esta consulta pública lo evita.
on:
  schedule:
    - cron: "37 14 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar la API pública de Supabase
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'eyJ[^"]*' config.js)
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/personas?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase respondió $code"
          test "$code" = "200"
