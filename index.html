<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="BMSN">
  <title>BMSN</title>
  <meta name="description" content="BMSN: planes, asistencia, anfitriones y encuestas del mes.">
  <link rel="manifest" href="manifest.webmanifest?v=22">
  <link rel="icon" type="image/png" href="icons/favicon-64.png?v=22">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=22">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>try{var t=localStorage.getItem("bmsn-tema");if(t&&t!=="neon")document.documentElement.dataset.tema=t}catch(e){}</script>
  <link rel="stylesheet" href="styles.css?v=22">
</head>
<body>
  <header class="top">
    <a class="logo" href="#inicio" aria-label="BMSN inicio"><img src="icons/logo.png" alt="BMSN" width="44" height="44"><span class="logo-txt">BMSN</span></a>
    <div class="top-der">
      <button class="btn-tema" data-a="temas" aria-label="Cambiar tema" title="Cambiar tema">🎨</button>
      <a class="btn-admin-top" href="#admin" aria-label="Panel de admin" title="Panel de admin (5)"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></a>
      <button class="cuenta" id="btn-cuenta" aria-label="Cuenta"></button>
    </div>
  </header>

  <main id="vista"><div class="cargando">Cargando…</div></main>

  <nav class="nav" aria-label="Secciones">
    <a href="#inicio" data-nav="inicio">
      <svg viewBox="0 0 24 24"><path d="M4 20V10l8-6 8 6v10h-5v-6H9v6z"/></svg><span>Inicio</span>
    </a>
    <a href="#planes" data-nav="planes">
      <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Planes</span>
    </a>
    <button class="fab" id="btn-nuevo" aria-label="Anotar plan" title="Anotar plan (N)">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="fab-txt">Anotar plan</span>
    </button>
    <a href="#encuestas" data-nav="encuestas">
      <svg viewBox="0 0 24 24"><path d="M5 20V12M12 20V4M19 20v-6"/></svg><span>Encuestas</span>
    </a>
    <a href="#gente" data-nav="gente">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg><span>Gente</span>
    </a>
    <a href="#admin" data-nav="admin" class="nav-admin">
      <svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.3-7 10-4-1.7-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><span>Admin</span>
    </a>
  </nav>

  <dialog class="hoja" id="hoja">
    <div class="hoja-asa" aria-hidden="true"></div>
    <div id="hoja-contenido"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=22"></script>
  <script src="app.js?v=22"></script>
</body>
</html>
